services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      retries: 5
      start_period: 5s
    restart: on-failure

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: cub kafka-ready -b kafka:29092 1 10
      interval: 10s
      retries: 5
      start_period: 10s
    restart: on-failure

  order_db:
    image: postgres:15
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d order_db"]
      interval: 5s
      retries: 5
    restart: on-failure

  inventory_db:
    image: postgres:15
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inventory_db"]
      interval: 5s
      retries: 5
    restart: on-failure

  order_service:
    build: ./order_service
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./order_service:/app
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      order_db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=order_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    restart: on-failure

  inventory_service:
    build: ./inventory_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./inventory_service:/app
    depends_on:
      kafka:
        condition: service_healthy
      inventory_db:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+psycopg://user:password@inventory_db:5432/inventory_db
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: on-failure

  notification_service:
    build: ./notification_service
    command: python app.py
    volumes:
      - ./notification_service:/app
    ports:
      - "5001:5001"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: on-failure

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - order_service
      - notification_service
    restart: on-failure

volumes:
  order_db_data:
  inventory_db_data:
